*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{min-height:100vh;font-family:'Cormorant Garamond','MushFB',Georgia,serif;color:var(--brown);
background:radial-gradient(120% 55% at 100% 0,rgba(139,15,34,.9) 0,rgba(139,15,34,0) 55%),radial-gradient(120% 55% at 0 100%,rgba(139,15,34,.9) 0,rgba(139,15,34,0) 55%),linear-gradient(160deg,#fbefdf,#f3dcc2);background-attachment:fixed}
.arc{position:fixed;pointer-events:none;width:min(80vw,360px);aspect-ratio:1;border-radius:50%;border:1.5px solid var(--gold);opacity:.45}
.arc.a{left:-38vw;top:-10vw;border-right-color:transparent;border-bottom-color:transparent;transform:rotate(-20deg)}
.arc.b{right:-34vw;bottom:-8vw;border-left-color:transparent;border-top-color:transparent;transform:rotate(-15deg)}
.wrap{position:relative;max-width:440px;margin:0 auto;padding:max(34px,env(safe-area-inset-top)) 22px max(40px,env(safe-area-inset-bottom))}
.logo{display:block;width:76%;margin:0 auto;opacity:0;animation:in 1s forwards}
.tag{text-align:center;letter-spacing:.34em;padding-left:.34em;font-size:15px;margin-top:2px}
.dv{display:flex;align-items:center;gap:10px;margin:14px auto;width:70%}
.dv i{flex:1;height:1px;background:linear-gradient(90deg,transparent,#8a4a2a 45%,#8a4a2a 55%,transparent)}
.dv b{width:7px;height:7px;background:var(--red);transform:rotate(45deg);flex:none}
.slo{text-align:center;font-style:italic;font-weight:500;color:var(--red);font-size:20px}
.links{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.btn{position:relative;display:flex;align-items:center;min-height:72px;padding:8px 18px 8px 10px;border-radius:40px;text-decoration:none;color:var(--brown);overflow:hidden;
background:linear-gradient(180deg,#fff7ec,#f4dbbf);border:1.5px solid var(--gold);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55),0 8px 18px rgba(110,40,20,.2);
opacity:0;transform:translateY(20px);animation:in .7s cubic-bezier(.2,.8,.2,1) forwards;transition:transform .2s}
.btn:active{transform:scale(.97)!important}
.ic{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 38% 30%,#a11a30,#6e0c1d 75%);box-shadow:0 4px 9px rgba(70,8,18,.4)}
.ic svg{width:26px;height:26px;fill:#fbeedc}
.t{flex:1;text-align:center;font-style:italic;font-weight:600;font-size:24px;line-height:1.05;padding:0 8px;position:relative;z-index:1}
.ch{width:11px;height:11px;border-right:2.5px solid var(--brown);border-top:2.5px solid var(--brown);transform:rotate(45deg);margin-right:6px;position:relative;z-index:1}
.fl{position:absolute;right:-14px;top:50%;width:84px;height:84px;margin-top:-42px;color:#d9a878;opacity:.28}
.ft{text-align:center;letter-spacing:.3em;padding-left:.3em;font-size:15px;margin-top:30px}
.heart{display:block;margin:10px auto 0;width:24px;fill:none;stroke:var(--red);stroke-width:1.8}
@keyframes in{to{opacity:1;transform:none}}
</style></head><body>
